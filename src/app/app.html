<header class="app-header">

	<div class="logo">Happy Pet</div>

	<nav>
		<a routerLink="/">Home</a>
		@if (!logado){
			<a routerLink="/login">Login</a>
			<a routerLink="/cadastro">Sign in</a>
		}
		
		@if (logado) {
			<button (click)="sair()">Sair</button>
		}
	</nav>

	<nav class="header-actions">

			carrinho
		</a>
		<a routerLink="/favoritos">
			❤️ Favoritos
		</a>
	</nav>

</header>
