<div class="cadastro-page">

    <!-- Logo -->
    <div class="logo">
        <img src="/icon/icon.png" id="img-icon">
        <span id="name-logo">Happy pet</span>
    </div>

    <!-- Área do cadastro -->
    <form class="cadastro">

        <h1>Cadastro</h1>

        <!-- Nome -->
        <div class="input-group">
            <div class="input-icon">
                👤
            </div>

            <input
                type="text"
                placeholder="Digite seu nome"
                id="nome">
        </div>

        <!-- Email -->
        <div class="input-group">
            <div class="input-icon">
                ✉
            </div>

            <input
                type="email"
                placeholder="Digite seu email"
                id="email">
        </div>

        <!-- Senha -->
        <div class="input-group">
            <div class="input-icon">
                🔒
            </div>

            <input
                type="password"
                placeholder="Digite sua senha"
                id="senha">
        </div>

        <!-- Confirmar senha -->
        <div class="input-group">
            <div class="input-icon">
                🔒
            </div>

            <input
                type="password"
                placeholder="Confirme sua senha"
                id="confirmarSenha">
        </div>

    </form>

    <!-- Animais + botão -->
    <div class="foto-bttn">

        <img
            src="/img/animal.png"
            alt="Cachorro e gato">

        <button>
            CADASTRAR
        </button>

    </div>

</div>
